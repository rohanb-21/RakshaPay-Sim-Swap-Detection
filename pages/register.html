<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RakshaPay Bank — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#060b18;--surface:#0d1626;--border:#1a2840;--cyan:#38bdf8;--cyan-dim:rgba(56,189,248,0.12);--green:#34d399;--red:#f87171;--text:#e2e8f0;--muted:#64748b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(56,189,248,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.12}
.orb1{width:500px;height:500px;background:#6366f1;top:-150px;right:-100px}
.orb2{width:350px;height:350px;background:#0ea5e9;bottom:-80px;left:-60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:50px 48px;width:95%;max-width:480px;box-shadow:0 0 60px rgba(56,189,248,0.07);position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-icon{width:38px;height:38px;background:var(--cyan-dim);border:1px solid rgba(56,189,248,0.3);border-radius:9px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px}
.logo-text{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px}
.logo-text span{color:var(--cyan)}
h2{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:30px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,189,248,0.1)}
input::placeholder{color:var(--muted)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#060b18}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(56,189,248,0.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.alert{padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none}
.alert.show{display:block}
.alert-red{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--red)}
.alert-green{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);color:var(--green)}
.link-row{text-align:center;font-size:14px;color:var(--muted);margin-top:20px}
.link-row a{color:var(--cyan);text-decoration:none;font-weight:500}
.info-note{background:var(--cyan-dim);border:1px solid rgba(56,189,248,0.2);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.info-note span{color:var(--cyan)}
.spinner{width:16px;height:16px;border:2px solid rgba(6,11,24,0.3);border-top-color:#060b18;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="card">
<div class="logo">
<div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
<div class="logo-text">RAKSHA<span>PAY</span></div>
</div>
<h2>Create Account</h2>
<p class="subtitle">Join RakshaPay — protected by SIM Swap Detection</p>
<div class="info-note">🎓 <span>Demo Mode:</span> Starting balance ₹1,00,000. Use any phone number.</div>
<div id="alert" class="alert"></div>
<div class="form-row">
<div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Aryan Sharma"/></div>
<div class="form-group"><label>Phone Number</label><input type="text" id="phone" placeholder="9876543210"/></div>
</div>
<div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="aryan@email.com"/></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Create a strong password" onkeydown="if(event.key==='Enter') doRegister()"/></div>
<button class="btn btn-primary" id="regBtn" onclick="doRegister()">CREATE ACCOUNT</button>
<div class="link-row">Already have an account? <a href="/">Sign In</a></div>
</div>
<script>
function showAlert(type,msg){const el=document.getElementById('alert');el.className=`alert show alert-${type}`;el.textContent=msg;}
async function doRegister(){
const name=document.getElementById('name').value.trim();
const phone=document.getElementById('phone').value.trim();
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const btn=document.getElementById('regBtn');
if(!name||!phone||!email||!password){showAlert('red','Please fill in all fields.');return;}
if(password.length<6){showAlert('red','Password must be at least 6 characters.');return;}
btn.disabled=true;btn.innerHTML='<span class="spinner"></span>CREATING...';
try{
const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,email,password})});
const data=await res.json();
if(data.success){showAlert('green','✅ Account created! Redirecting...');setTimeout(()=>window.location.href='/',1500);}
else{showAlert('red',data.detail||'Registration failed.');}
}catch(e){showAlert('red','Cannot connect to server.');}
finally{btn.disabled=false;btn.innerHTML='CREATE ACCOUNT';}
}
</script>
</body>
</html>
